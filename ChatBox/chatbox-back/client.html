<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>💬 Chat temps réel</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 20px;
      }
      #messages {
        list-style: none;
        padding: 0;
        border: 1px solid #ccc;
        background: white;
        height: 300px;
        overflow-y: auto;
        margin-bottom: 10px;
      }
      #messages li {
        margin: 5px;
        padding: 6px 8px;
        border-radius: 5px;
        word-wrap: break-word;
      }
      .system-msg {
        background: #ffe0b2;
        font-style: italic;
      }
      .user-msg {
        background: #eef;
      }
      input {
        padding: 5px;
        width: 60%;
      }
      button {
        padding: 5px 10px;
        margin-left: 5px;
      }
      #user-form {
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ddd;
        background: #fff;
      }
      #chat-interface {
        display: none;
      }
      /* Style pour l'indicateur de frappe */
      #typing-indicator {
        font-size: 0.9em;
        margin-bottom: 5px;
        color: gray;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>💬 Chat Temps Réel</h1>

    <div id="user-form">
      <label for="username-input">Entre ton pseudo :</label>
      <input id="username-input" placeholder="Ex: JeanDu75" />
      <button onclick="setUsername()">Définir Pseudo</button>
      <span id="status"></span>
    </div>

    <div id="chat-interface">
      <ul id="messages"></ul>
      
      <div id="typing-indicator"></div>
      
      <input 
        id="msg" 
        placeholder="Écris ton message..." 
        onkeydown="handleTyping(true)" 
        onkeyup="handleTyping(false)"
      />
      <button onclick="sendMessage()">Envoyer</button>

      <br /><br />

      <input id="gifUrl" placeholder="Colle un lien GIF (optionnel)" />
      <button onclick="sendGif()">Envoyer GIF</button>
    </div>

    <script>
      const socket = io("http://localhost:3001");
      const chatInterface = document.getElementById("chat-interface");
      const userForm = document.getElementById("user-form");
      const statusSpan = document.getElementById("status");
      // 💡 Variables pour l'indicateur de frappe
      const typingIndicator = document.getElementById("typing-indicator");
      const typingUsers = new Set();
      let typingTimeout;
      let isTyping = false;

      // ------------------------------------------------------------------
      // --- NOUVEAU : Logique de l'indicateur de frappe ---
      // ------------------------------------------------------------------
      
      function handleTyping(typing) {
          const messageInput = document.getElementById("msg");
          const content = messageInput.value; // Ne pas utiliser .trim() ici pour détecter l'espace
          
          // Logique de Démarrage
          if (content.length > 0 && !isTyping) {
              // Envoie le signal true
              socket.emit('typing', true);
              isTyping = true;
          }
          
          // Logique d'Arrêt : uniquement si la barre de saisie est vide
          if (content.length === 0 && isTyping) {
              clearTimeout(typingTimeout);
              socket.emit('typing', false);
              isTyping = false;
          }
          
          // Le timer est conservé, mais il ne sert plus à envoyer 'false'
          // Il sert à réinitialiser le statut si l'utilisateur met une pause
          clearTimeout(typingTimeout);
          if (isTyping) {
              typingTimeout = setTimeout(() => {
                  // Si le temps expire mais qu'il y a encore du texte, on ne fait rien
                  // Si le temps expire et qu'il n'y a plus de texte, le bloc précédent l'a déjà géré.
              }, 5000); 
          }
      }

      socket.on("userTyping", (data) => {
          if (data.isTyping) {
              typingUsers.add(data.username);
          } else {
              typingUsers.delete(data.username);
          }
          
          updateTypingIndicator();
      });
      
      function updateTypingIndicator() {
          const usersArray = Array.from(typingUsers);
          
          if (usersArray.length === 0) {
              typingIndicator.textContent = '';
          } else if (usersArray.length === 1) {
              typingIndicator.textContent = `${usersArray[0]} est en train d'écrire...`;
          } else if (usersArray.length === 2) {
              typingIndicator.textContent = `${usersArray.join(' et ')} sont en train d'écrire...`;
          } else {
              typingIndicator.textContent = 'Plusieurs personnes sont en train d\'écrire...';
          }
          
          const ul = document.getElementById("messages");
          ul.scrollTop = ul.scrollHeight;
      }
      
      // ------------------------------------------------------------------
      // --- Fonctions existantes (MODIFIÉES pour stopper l'indicateur) ---
      // ------------------------------------------------------------------

      // 🔹 Fonction pour définir le pseudo
      function setUsername() {
        const username = document.getElementById("username-input").value.trim();
        if (username) {
          socket.emit("setUser", { username });
          statusSpan.textContent = "Envoi du pseudo...";
          statusSpan.style.color = 'orange';
        }
      }

      // 🔹 Réponse du serveur après la définition du pseudo
      socket.on("userSet", (data) => {
        statusSpan.textContent = `Bienvenue, ${data.username}!`;
        statusSpan.style.color = 'green';
        userForm.style.display = 'none';
        chatInterface.style.display = 'block';
      });
      
      // 🔹 Notification d'erreur du backend
      socket.on("error", (msg) => {
          console.error('Erreur du serveur:', msg);
          statusSpan.textContent = `Erreur: ${msg}`;
          statusSpan.style.color = 'red';
      });

      // 🔹 Vérifier la connexion
      socket.on("connect", () => {
        console.log("Connecté au serveur Socket.IO :", socket.id);
        userForm.style.display = 'block';
        chatInterface.style.display = 'none';
        statusSpan.textContent = "Connecté au serveur.";
        statusSpan.style.color = 'blue';
      });

      socket.on("connect_error", (err) => {
        console.error("Erreur de connexion :", err);
        statusSpan.textContent = "Erreur de connexion au serveur.";
        statusSpan.style.color = 'red';
      });

      // 🔹 Envoi d’un message texte (MODIFIÉ)
      function sendMessage() {
        const message = document.getElementById("msg").value.trim();
        if (!message) return;
        
        // 💡 Assure l'arrêt de l'indicateur local et envoie le signal d'arrêt
        clearTimeout(typingTimeout);
        if (isTyping) {
            socket.emit('typing', false);
            isTyping = false;
        }
        
        socket.emit("sendMessage", { message });
        document.getElementById("msg").value = "";
      }

      // 🔹 Envoi d’un GIF (MODIFIÉ)
      function sendGif() {
        const gifUrl = document.getElementById("gifUrl").value.trim();
        if (!gifUrl) return;

        // 💡 Assure l'arrêt de l'indicateur local et envoie le signal d'arrêt
        clearTimeout(typingTimeout);
        if (isTyping) {
            socket.emit('typing', false);
            isTyping = false;
        }

        socket.emit("sendMessage", { gifUrl });
        document.getElementById("gifUrl").value = "";
      }

      // 🔹 Réception d’un message (texte ou GIF)
      socket.on("receiveMessage", (data) => {
        console.log("Message reçu :", data);
        displayMessage(data);
      });

      // 🔹 Chargement de l’historique
      socket.on("loadMessages", (messages) => {
        console.log("Historique reçu :", messages);
        const ul = document.getElementById("messages");
        ul.innerHTML = "";
        messages.forEach(displayMessage);
      });

      // 🔹 Fonction d’affichage d'un message utilisateur (texte + GIF)
      function displayMessage(data) {
        const li = document.createElement("li");
        li.classList.add('user-msg');
        
        let content = `<strong>${data.username} :</strong> `;

        if (data.message) {
          content += data.message;
        }

        li.innerHTML = content;

        if (data.gifUrl) {
          const gif = document.createElement("img");
          gif.src = data.gifUrl;
          gif.alt = "GIF";
          gif.style.maxWidth = "150px";
          gif.style.display = "block";
          gif.style.marginTop = "5px";
          
          if (!data.message) {
             li.innerHTML = `<strong>${data.username} :</strong>`;
          }
          
          li.appendChild(gif);
        }

        const ul = document.getElementById("messages");
        ul.appendChild(li);
        ul.scrollTop = ul.scrollHeight;
      }
      
      // 🔹 Fonction d’affichage des messages système/notifications (Non utilisée pour 'userJoined')
      function displaySystemMessage(text) {
          const li = document.createElement("li");
          li.classList.add('system-msg');
          li.textContent = text;
          
          const ul = document.getElementById("messages");
          ul.appendChild(li);
          ul.scrollTop = ul.scrollHeight;
      }
    </script>
  </body>
</html>
